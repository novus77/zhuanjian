<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>转间 · 第一关试玩</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#17251f; }
    #unity-canvas { display:block; width:100%; height:100%; outline:none; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; gap:16px; padding:24px;
      color:#f3ead5; background:#17251f; font:18px/1.6 system-ui; text-align:center; }
    #loading h1 { margin:0; font-size:30px; }
    progress { width:min(280px,75vw); accent-color:#d8b477; }
    #status { max-width:400px; white-space:pre-wrap; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="转间第一关游戏画面"></canvas>
  <div id="loading"><h1>转间 · 四扇门</h1><progress id="progress" max="1" value="0"></progress><div id="status">正在进入书房…</div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    createUnityInstance(canvas, {
      arguments: [],
#if PROGRESSIVE_ASSET_LOADING
      primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
      secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => {
        if (type === "error") {
          loading.style.display = "grid";
          status.textContent = message;
        }
      }
    }, progress => {
      document.getElementById("progress").value = progress;
      status.textContent = "正在进入书房… " + Math.round(progress * 100) + "%";
    }).then(() => {
      loading.style.display = "none";
      canvas.focus();
    }).catch(message => {
      status.textContent = "加载未完成，请刷新重试。\n" + message;
    });
  </script>
</body>
</html>
